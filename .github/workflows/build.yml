name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    paths-ignore:
      - LICENSE
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-linux:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest-container-runtime-depot
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, RelWithDebInfo, Release]
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      BUILD_PRESET: ${{ matrix.preset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat /etc/os-release
          cmake --version
          ninja --version
          "$CC" --version
          "$CXX" --version
          git submodule status --recursive

      - name: Build
        run: |
          cmake --preset "$BUILD_PRESET"
          cmake --build --preset "$BUILD_PRESET" --parallel "$(nproc)"

      - name: Package artifact
        run: tar -C "out/Linux/$BUILD_PRESET/package" -czf "linux-$BUILD_PRESET.tar.gz" addons

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.preset }}
          path: linux-${{ matrix.preset }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows / ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, RelWithDebInfo, Release]
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_PRESET: ${{ matrix.preset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build environment
        run: |
          Write-Output "MSVC tools: $env:VCToolsVersion"
          cmake --version
          ninja --version
          git submodule status --recursive

      - name: Build
        run: |
          cmake --preset $env:BUILD_PRESET
          cmake --build --preset $env:BUILD_PRESET --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.preset }}
          path: out/Windows/${{ matrix.preset }}/package
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release
        run: |
          mkdir -p release
          for preset in Release RelWithDebInfo; do
            suffix=""
            if [[ "$preset" == "RelWithDebInfo" ]]; then
              suffix="-relwithdebinfo"
            fi
            cp "artifacts/linux-$preset/linux-$preset.tar.gz" "release/ClientCvarValue-${GITHUB_REF_NAME}-linux$suffix.tar.gz"
            (
              cd "artifacts/windows-$preset"
              7z a -tzip -mx=9 "../../release/ClientCvarValue-${GITHUB_REF_NAME}-windows$suffix.zip" addons
            )
          done

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.tar.gz
            release/*.zip
          fail_on_unmatched_files: true
