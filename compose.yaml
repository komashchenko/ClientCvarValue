services:
  build-linux:
    image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest-container-runtime-depot
    platform: linux/amd64
    working_dir: /workspace
    network_mode: none
    environment:
      CC: clang
      CXX: clang++
      BUILD_PRESET: "${BUILD_PRESET:-RelWithDebInfo}"
      BUILD_JOBS: "${BUILD_JOBS:-4}"
    volumes:
      - .:/workspace
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        cmake --preset "$$BUILD_PRESET"
        cmake --build --preset "$$BUILD_PRESET" --parallel "$$BUILD_JOBS"
